<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThingSpeak Dark Theme Dashboard</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        /* --- 🎨 DARK THEME STYLING --- */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a1a; /* Dark Background */
            color: #ffffff; 
            margin: 20px; 
        }
        .dashboard-container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #1a1a1a; 
        }
        h1 { 
            text-align: center; 
            color: #007bff; 
            margin-bottom: 30px;
        }
        .data-grid { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
        }
        .chart-card, .value-card, .control-card { 
            background-color: #2c2c2c; /* Dark Card Background */
            border-radius: 8px; 
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        /* Chart Area (Takes up 66% width) */
        .chart-area {
            flex: 2 1 65%; /* Takes 65% width */
            min-height: 400px;
        }
        /* Side Panel Area (Takes up 33% width) */
        .side-panel {
            flex: 1 1 30%; /* Takes 30% width */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .data-label { 
            font-size: 1.1em; 
            font-weight: bold; 
            margin-bottom: 10px; 
            color: #888;
        }
        .data-value {
            font-size: 2.2em;
            color: #00e0ff; /* Bright color for metrics */
            font-weight: bold;
        }
        /* Value Cards */
        .value-card {
            border-left: 5px solid #007bff; /* Accent color */
        }
        /* Control Card */
        .control-card {
            border: 1px solid #007bff; 
            text-align: center; 
            order: 99; /* Push to the bottom */
            flex: 1 1 100%;
        }
