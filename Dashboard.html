<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final ThingSpeak MQTT Dashboard</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/justgage/1.4.1/justgage.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 20px; }
        .dashboard-container { max-width: 900px; margin: 0 auto; padding: 20px; background-color: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        h1 { text-align: center; color: #007bff; }
        .data-grid { display: flex; flex-wrap: wrap; justify-content: space-around; gap: 20px; margin-top: 20px; }
        .data-card { flex: 1 1 45%; min-width: 250px; border: 1px solid #ccc; padding: 15px; border-radius: 6px; background-color: #e9ecef; text-align: center; }
        .data-label { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; color: #495057; }
        .data-value { font-size: 2.0em; color: #28a745; }
        .gauge-container { width: 100%; height: 200px; }
        .status-bar { padding: 10px; margin-top: 20px; border-radius: 4px; text-align: center; }
        .status-connected { background-color: #d4edda; color: #155724; }
        .status-disconnected { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>ThingSpeak Real-Time Sensor Data</h1>
        
        <div id="connection_status" class="status-bar status-disconnected">
            Disconnected
        </div>

        <div class="data-grid">
            
            <div class="data-card">
                <div class="data-label">Field 1 (Temperature)</div>
                <div id="gauge_field1" class="gauge-container"></div>
                <div id="field1_value" class="data-value">--</div>
            </div>

            <div class="data-card">
                <div class="data-label">Field 2 (Humidity)</div>
                <div id="field2_value" class="data-value">-- Awaiting Data --</div>
            </div>

        </div>
    </div>

    <script>
        // --- ⚙️ USER CONFIGURATION (All credentials integrated) ---
        const CHANNEL_ID = "3147672"; 
        const READ_API_KEY = "1379T98MCK1LPPAZ"; 
        
        // MQTT Device Credentials
        const MQTT_CLIENT_ID = "CxkfGzYhFQofIywFBT0WFTk";
        const MQTT_USERNAME = "CxkfGzYhFQofIywFBT0WFTk";
        const MQTT_PASSWORD = "2xiaTbfiFUjAKQd4aSouGN4g";

        // ThingSpeak MQTT Broker details for Secure WebSockets (WSS)
        const MQTT_HOST = "mqtt3.thingspeak.com";
        const MQTT_PORT = 443; // Secure WebSocket port
        const MQTT_PATH = "/mqtt";

        // Topic format for JSON subscription: channels/<ChannelID>/subscribe/json/<ReadAPIKey>
        const MQTT_TOPIC = `channels/${CHANNEL_ID}/subscribe/json/${READ_API_KEY}`;
        // --- -------------------------------------------------- ---

        let client;
        let gaugeField1; 

        const statusElement = document.getElementById("connection_status");
        const field1Element = document.getElementById("field1_value");
        const field2Element = document.getElementById("field2_value");

        // Initialize Gauge 
        function initGauge() {
            gaugeField1 = new JustGage({
                id: "gauge_field1",
                value: 0,
                min: 0,
                max: 100, // **Adjust this range for your Field 1 data (e.g., 0-50 for typical temp)**
                title: "Current Value",
                label: "Units", 
                pointer: true,
                relativeGaugeSize: true,
                gaugeWidthScale: 0.6
            });
        }

        // Function to start the MQTT connection
        function startConnect() {
            initGauge(); 
            statusElement.innerHTML = "Connecting...";
            statusElement.className = "status-bar";

            client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, MQTT_PATH, MQTT_CLIENT_ID);

            client.onConnectionLost = onConnectionLost;
            client.onMessageArrived = onMessageArrived;

            const options = {
                timeout: 3,
                useSSL: true, // Use WSS (Secure WebSockets)
                userName: MQTT_USERNAME,
                password: MQTT_PASSWORD,
                onSuccess: onConnect,
                onFailure: onFailure
            };

            client.connect(options);
        }

        function onConnect() {
            console.log("MQTT Connected. Subscribing to " + MQTT_TOPIC);
            statusElement.innerHTML = "Connected to ThingSpeak!";
            statusElement.className = "status-bar status-connected";
            
            // Subscribe to the channel topic
            client.subscribe(MQTT_TOPIC, { qos: 0 });
        }

        function onFailure(responseObject) {
            console.error("MQTT Connection Failed: " + responseObject.errorMessage);
            statusElement.innerHTML = "Connection Failed! Check console for details.";
            statusElement.className = "status-bar status-disconnected";
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.warn("Connection Lost: " + responseObject.errorMessage);
                statusElement.innerHTML = "Connection Lost! Attempting to reconnect...";
                statusElement.className = "status-bar status-disconnected";
            }
        }

        // Called when a message arrives
        function onMessageArrived(message) {
            const payload = message.payloadString;

            try {
                // ThingSpeak sends a JSON object containing the field data
                const data = JSON.parse(payload);
                
                // Update Field 1
                if (data.field1 !== undefined) {
                    const value1 = parseFloat(data.field1);
                    if (!isNaN(value1)) {
                        field1Element.innerHTML = value1.toFixed(2);
                        gaugeField1.refresh(value1);
                    }
                }

                // Update Field 2
                if (data.field2 !== undefined) {
                    const value2 = parseFloat(data.field2);
                    if (!isNaN(value2)) {
                        field2Element.innerHTML = value2.toFixed(2);
                    } else {
                        field2Element.innerHTML = data.field2; 
                    }
                }

            } catch (e) {
                console.error("Error parsing JSON payload:", e, "Payload:", payload);
            }
        }

        // Start the connection when the page loads
        window.onload = startConnect;

    </script>

</body>
</html>
